<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17212B">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Freedi Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17212B; --ink-2:#233140; --gold:#F4B400; --gold-soft:#FCEBB0;
  --lagoon:#0E6B63; --mist:#ECEFEE; --paper:#FFFFFF; --line:#D9DFDD;
  --muted:#5A6771; --danger:#B3261E;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:var(--body);font-size:16px;line-height:1.45;color:var(--ink);background:var(--mist);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Chargement */
.boot{height:100dvh;display:grid;place-items:center;background:var(--ink);color:var(--gold);font-family:var(--display);font-size:1.6rem;font-weight:800}

/* Connexion */
.auth{min-height:100dvh;display:grid;grid-template-rows:auto 1fr;background:var(--ink)}
.hero{padding:calc(28px + env(safe-area-inset-top,0px)) 24px 28px;color:#fff}
.wordmark{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,9vw,3.4rem);line-height:1;color:var(--gold);letter-spacing:-.02em}
.tagline{margin:10px 0 20px;max-width:34ch;color:#D6DEE3}
.demo{display:flex;flex-direction:column;gap:8px;max-width:300px}
.demo .b{margin:0;padding:9px 13px;border-radius:16px;font-size:.95rem}
.demo .in{background:#fff;color:var(--ink);border-bottom-left-radius:4px;align-self:flex-start}
.demo .out{background:var(--gold);color:var(--ink);border-bottom-right-radius:4px;align-self:flex-end}
.panel{background:var(--paper);border-radius:22px 22px 0 0;padding:26px 24px calc(28px + env(safe-area-inset-bottom,0px))}
.panel form{max-width:380px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-family:var(--display);font-size:1.5rem}
.field{display:flex;flex-direction:column;gap:5px;font-weight:500;font-size:.92rem}
.field input{padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:1rem}
.field input:focus{border-color:var(--lagoon);outline:none;box-shadow:0 0 0 3px rgba(14,107,99,.18)}
.btn{padding:13px 16px;border:0;border-radius:10px;background:var(--gold);color:var(--ink);font-weight:600;font-size:1rem}
.btn:disabled{opacity:.6;cursor:wait}
.link{background:none;border:0;padding:6px;color:var(--lagoon);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.error{margin:0;min-height:1.2em;color:var(--danger);font-size:.92rem}
@media(min-width:820px){
  .auth{grid-template-rows:none;grid-template-columns:1.1fr 1fr}
  .hero{display:flex;flex-direction:column;justify-content:center;padding:48px 64px}
  .panel{border-radius:0;display:grid;place-items:center}
}

/* Application */
.app{height:100dvh;display:grid;grid-template-columns:340px 1fr;background:var(--paper)}
.sidebar{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--paper)}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;background:var(--ink);color:#fff}
.side-head strong{display:block;font-family:var(--display);font-size:1.15rem}
.side-head .sub{color:#B9C4CB;font-size:.82rem}
.ghost{padding:7px 12px;border:1px solid #4A5966;border-radius:999px;background:transparent;color:#fff;font-size:.88rem}
.search{padding:10px 12px;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--mist);font-size:.98rem}
.list{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;min-height:0}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border:0;border-bottom:1px solid var(--mist);background:none;text-align:left}
.item:hover{background:var(--mist)}
.item.active{background:var(--gold-soft)}
.item .name{font-weight:600}
.item .hint{display:block;color:var(--muted);font-size:.85rem}
.group-label{padding:12px 16px 6px;color:var(--muted);font-size:.85rem;font-weight:600}
.avatar{flex:none;display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;color:#fff;font-family:var(--display);font-weight:800;font-size:1.1rem}
.avatar.gold{background:var(--gold);color:var(--ink)}

.chat{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--mist)}
.placeholder{flex:1;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.chatbox{flex:1;display:flex;flex-direction:column;min-height:0}
.chat-head{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--ink);color:#fff}
.chat-head strong{display:block;font-family:var(--display)}
.chat-head .sub{color:#B9C4CB;font-size:.82rem}
.back{display:none;padding:6px 10px;border:0;background:transparent;color:#fff;font-size:1.4rem;line-height:1}
.messages{flex:1;min-height:0;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;margin:10px 0 6px;padding:3px 12px;border-radius:999px;background:#fff;color:var(--muted);font-size:.8rem}
.row{display:flex;flex-direction:column;max-width:82%}
.row.me{align-self:flex-end;align-items:flex-end}
.row.them{align-self:flex-start;align-items:flex-start}
.row.first{margin-top:8px}
.who{margin:0 6px 2px;color:var(--lagoon);font-size:.8rem;font-weight:600}
.bubble{padding:8px 12px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left}
.me .bubble{background:var(--gold);color:var(--ink);border-bottom-right-radius:4px}
.them .bubble{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.time{margin:2px 6px 0;color:var(--muted);font-size:.74rem}
.del{margin:4px 0 0;padding:4px 10px;border:1px solid var(--danger);border-radius:999px;background:#fff;color:var(--danger);font-size:.8rem}
.empty{margin:auto;color:var(--muted);text-align:center;padding:24px}
.composer{display:flex;align-items:flex-end;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;max-height:120px;padding:10px 13px;border:1.5px solid var(--line);border-radius:18px;background:var(--mist);line-height:1.35}
.composer textarea:focus{outline:none;border-color:var(--lagoon)}
.attach{flex:none;display:grid;place-items:center;width:42px;height:42px;border:0;border-radius:50%;background:var(--mist);color:var(--ink)}
.preview{position:relative;padding:8px 12px;background:var(--paper);border-top:1px solid var(--line)}
.preview img{display:block;max-height:120px;max-width:100%;border-radius:10px}
.preview-x{position:absolute;top:2px;left:2px;width:28px;height:28px;border:0;border-radius:50%;background:var(--ink);color:#fff;font-size:18px;line-height:1}
.bubble.has-photo{padding:4px}
.bubble.has-photo .cap{padding:6px 8px 4px}
.photo{display:block;width:240px;max-width:100%;height:auto;border-radius:12px;cursor:zoom-in}
.lightbox{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:12px;background:rgba(0,0,0,.92)}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.call-btn{margin-left:auto;display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;background:var(--gold);color:var(--ink)}
.call-overlay{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:var(--ink);color:#fff;text-align:center}
.call-overlay .avatar{width:110px;height:110px;font-size:2.6rem}
.call-overlay h2{margin:8px 0 0;font-family:var(--display);font-size:1.7rem}
.call-overlay p{margin:0;color:#B9C4CB;min-height:1.4em}
.call-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:26px;padding-bottom:env(safe-area-inset-bottom,0px)}
.pill{padding:14px 22px;border:0;border-radius:999px;font-weight:600;font-size:1rem;background:#2E3D4C;color:#fff}
.pill.ok{background:#1E9E5A}
.pill.bad{background:#C7362D}
.lightbox .del{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%)}
.send{padding:10px 16px;border:0;border-radius:18px;background:var(--gold);font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:90vw;padding:10px 16px;border-radius:10px;background:var(--ink);color:#fff;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:760px){
  .app{grid-template-columns:1fr}
  .chat{display:none}
  .app.chat-open .sidebar{display:none}
  .app.chat-open .chat{display:flex}
  .back{display:block}
  .row{max-width:88%}
}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>

<div id="boot" class="boot">Freedi Chat</div>

<div id="auth" class="auth" hidden>
  <section class="hero">
    <h1 class="wordmark">Freedi Chat</h1>
    <p class="tagline">Discutez avec vos proches et vos clients, en temps réel.</p>
    <div class="demo" aria-hidden="true">
      <p class="b in">On se retrouve à 18 h ?</p>
      <p class="b out">Oui, j'arrive.</p>
      <p class="b out">Je prends la commande avec moi.</p>
    </div>
  </section>
  <section class="panel">
    <form id="authForm" novalidate>
      <h2 id="authTitle">Connexion</h2>
      <label class="field" id="nameField" hidden><span>Votre nom</span>
        <input id="name" autocomplete="name" maxlength="40"></label>
      <label class="field"><span>Email</span>
        <input id="email" type="email" autocomplete="email" inputmode="email"></label>
      <label class="field"><span>Mot de passe (6 caractères minimum)</span>
        <input id="password" type="password" autocomplete="current-password"></label>
      <p id="authError" class="error" role="alert"></p>
      <button class="btn" id="authSubmit">Se connecter</button>
      <button type="button" class="link" id="resetBtn">Mot de passe oublié ?</button>
      <button type="button" class="link" id="switchMode">Pas encore de compte ? Créer un compte</button>
      <button type="button" class="btn install-btn" hidden>Installer l'application</button>
    </form>
  </section>
</div>

<div id="app" class="app" hidden>
  <aside class="sidebar">
    <header class="side-head">
      <div><strong id="meName"></strong><span class="sub">Connecté</span></div>
      <button class="ghost" id="logout">Se déconnecter</button>
    </header>
    <div class="search"><input id="search" type="search" placeholder="Rechercher un contact" aria-label="Rechercher un contact"></div>
    <button type="button" class="link install-btn" hidden style="margin:6px 12px;text-align:left">Installer l'application sur ce téléphone</button>
    <ul id="list" class="list"></ul>
  </aside>
  <main class="chat">
    <div id="placeholder" class="placeholder"><p>Choisissez une conversation pour commencer.</p></div>
    <div id="chatBox" class="chatbox" hidden>
      <header class="chat-head">
        <button class="back" id="back" aria-label="Retour à la liste">←</button>
        <span id="headAvatar"></span>
        <div><strong id="chatTitle"></strong><span class="sub" id="chatSub"></span></div>
        <button type="button" class="call-btn" id="callBtn" aria-label="Appel vocal" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></button>
      </header>
      <div id="messages" class="messages" aria-live="polite"></div>
      <div id="preview" class="preview" hidden>
        <img id="previewImg" alt="Photo à envoyer">
        <button type="button" id="previewCancel" class="preview-x" aria-label="Retirer la photo">×</button>
      </div>
      <form id="composer" class="composer">
        <input id="file" type="file" accept="image/*" hidden>
        <button type="button" class="attach" id="attach" aria-label="Ajouter une photo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
        <textarea id="input" rows="1" maxlength="2000" placeholder="Écrire un message" aria-label="Message"></textarea>
        <button class="send" type="submit">Envoyer</button>
      </form>
    </div>
  </main>
</div>

<div id="callOverlay" class="call-overlay" hidden>
  <div id="callAvatar"></div>
  <h2 id="callName"></h2>
  <p id="callStatus" role="status"></p>
  <div class="call-actions">
    <button type="button" class="pill" id="callMute" hidden>Couper le micro</button>
    <button type="button" class="pill ok" id="callAccept" hidden>Répondre</button>
    <button type="button" class="pill bad" id="callHang">Raccrocher</button>
  </div>
  <audio id="remoteAudio" autoplay playsinline></audio>
</div>

<div id="toast" class="toast" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword,
         signOut, updateProfile, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, query, where, orderBy, limit,
         onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============ CONFIGURATION FIREBASE ============
   Si la connexion échoue avec « clé invalide », recopiez ici
   exactement le bloc firebaseConfig de votre console Firebase. */
const firebaseConfig = {
  apiKey: "AIzaSyCyM8zfAJflKSeIMFz9e9qCznB85_gZpTo",
  authDomain: "messagerie-5acda.firebaseapp.com",
  projectId: "messagerie-5acda",
  storageBucket: "messagerie-5acda.firebasestorage.app",
  messagingSenderId: "1034575215133",
  appId: "1:1034575215133:web:b8f1e4794266f6646a4f4"
};
/* ================================================ */

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const COLORS = ["#0E6B63", "#B85C38", "#5B4B8A", "#2E6F9E", "#8A6D1F", "#A23E5B"];
const hash = s => [...(s || "?")].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);

let mode = "login";           // "login" ou "signup"
let users = [];               // contacts
let active = null;            // conversation ouverte
let unsubUsers = null, unsubMsgs = null;
let toastTimer = null;

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
}

function friendlyError(err) {
  const map = {
    "auth/invalid-credential": "Email ou mot de passe incorrect.",
    "auth/wrong-password": "Email ou mot de passe incorrect.",
    "auth/user-not-found": "Email ou mot de passe incorrect.",
    "auth/invalid-email": "Adresse email invalide.",
    "auth/email-already-in-use": "Cet email a déjà un compte. Connectez-vous.",
    "auth/weak-password": "Mot de passe trop court : 6 caractères minimum.",
    "auth/network-request-failed": "Pas de connexion internet.",
    "auth/too-many-requests": "Trop d'essais. Réessayez dans quelques minutes.",
    "auth/operation-not-allowed": "La connexion par email n'est pas activée dans Firebase (Authentication > Méthode de connexion).",
    "auth/invalid-api-key": "Clé Firebase invalide : recopiez la configuration dans le fichier.",
    "permission-denied": "Accès refusé : vérifiez les règles Firestore."
  };
  return map[err.code] || map[(err.code || "").replace("firestore/", "")] || "Une erreur est survenue. Réessayez.";
}

/* ---------- Connexion / inscription ---------- */
function setMode(m) {
  mode = m;
  const signup = m === "signup";
  $("#authTitle").textContent = signup ? "Créer un compte" : "Connexion";
  $("#authSubmit").textContent = signup ? "Créer mon compte" : "Se connecter";
  $("#switchMode").textContent = signup ? "J'ai déjà un compte" : "Pas encore de compte ? Créer un compte";
  $("#nameField").hidden = !signup;
  $("#resetBtn").hidden = signup;
  $("#password").autocomplete = signup ? "new-password" : "current-password";
  $("#authError").textContent = "";
}
$("#switchMode").onclick = () => setMode(mode === "login" ? "signup" : "login");

$("#authForm").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("#email").value.trim(), pass = $("#password").value, name = $("#name").value.trim();
  const errBox = $("#authError"), btn = $("#authSubmit");
  errBox.textContent = "";
  if (!email || !pass) { errBox.textContent = "Entrez votre email et votre mot de passe."; return; }
  if (mode === "signup" && name.length < 2) { errBox.textContent = "Entrez votre nom (2 lettres minimum)."; return; }
  btn.disabled = true;
  try {
    if (mode === "signup") {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });
      await setDoc(doc(db, "users", cred.user.uid), { name, nameLower: name.toLowerCase() }, { merge: true });
      $("#meName").textContent = name;
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
  } catch (err) {
    errBox.textContent = friendlyError(err);
  } finally { btn.disabled = false; }
});

$("#resetBtn").onclick = async () => {
  const email = $("#email").value.trim();
  if (!email) { $("#authError").textContent = "Entrez votre email, puis touchez « Mot de passe oublié »."; return; }
  try { await sendPasswordResetEmail(auth, email); toast("Email de réinitialisation envoyé."); }
  catch (err) { $("#authError").textContent = friendlyError(err); }
};

$("#logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  $("#boot").hidden = true;
  if (unsubUsers) { unsubUsers(); unsubUsers = null; }
  if (unsubMsgs) { unsubMsgs(); unsubMsgs = null; }
  if (unsubIncoming) { unsubIncoming(); unsubIncoming = null; }
  if (call) endCall();
  active = null;
  if (!user) {
    $("#app").hidden = true; $("#auth").hidden = false;
    $(".app").classList.remove("chat-open");
    return;
  }
  $("#auth").hidden = true; $("#app").hidden = false;
  $("#chatBox").hidden = true; $("#placeholder").hidden = false;
  $("#meName").textContent = user.displayName || user.email;
  if (user.displayName) {
    setDoc(doc(db, "users", user.uid), { name: user.displayName, nameLower: user.displayName.toLowerCase() }, { merge: true }).catch(() => {});
  }
  unsubUsers = onSnapshot(query(collection(db, "users"), orderBy("nameLower")),
    snap => { users = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(u => u.id !== user.uid); renderList(); },
    err => toast(friendlyError(err)));
  unsubIncoming = listenIncoming(user.uid);
  renderList();
});

/* ---------- Liste des conversations ---------- */
function avatar(name, gold) {
  const a = el("span", "avatar" + (gold ? " gold" : ""), (name || "?").trim().charAt(0).toUpperCase());
  if (!gold) a.style.background = COLORS[hash(name) % COLORS.length];
  return a;
}

function renderList() {
  const list = $("#list"), q = $("#search").value.trim().toLowerCase();
  list.replaceChildren();
  const add = (chatId, title, hint, gold, isGroup) => {
    const li = el("li");
    const b = el("button", "item" + (active && active.id === chatId ? " active" : ""));
    b.type = "button";
    const txt = el("span");
    txt.append(el("span", "name", title), el("span", "hint", hint));
    b.append(avatar(title, gold), txt);
    b.onclick = () => openChat(chatId, title, isGroup);
    li.append(b); list.append(li);
  };
  if (!q || "salon général".includes(q)) add("general", "Salon général", "Discussion ouverte à tous", true, true);
  const found = users.filter(u => !q || (u.nameLower || "").includes(q));
  if (found.length) list.append(el("li", "group-label", "Contacts"));
  found.forEach(u => {
    const me = auth.currentUser.uid;
    add([me, u.id].sort().join("_"), u.name, "Message privé", false, false);
  });
  if (!found.length && !users.length) {
    list.append(el("li", "group-label", "Aucun autre contact pour le moment. Invitez quelqu'un à créer un compte."));
  } else if (!found.length && q) {
    list.append(el("li", "group-label", "Aucun contact trouvé."));
  }
}
$("#search").addEventListener("input", renderList);

/* ---------- Conversation ---------- */
function openChat(chatId, title, isGroup) {
  if (unsubMsgs) unsubMsgs();
  active = { id: chatId, title, isGroup };
  $("#placeholder").hidden = true; $("#chatBox").hidden = false;
  $(".app").classList.add("chat-open");
  $("#chatTitle").textContent = title;
  $("#chatSub").textContent = isGroup ? "Tout le monde peut écrire ici" : "Conversation privée";
  $("#callBtn").hidden = !!isGroup;
  $("#headAvatar").replaceChildren(avatar(title, isGroup));
  $("#messages").replaceChildren(el("p", "empty", "Chargement…"));
  renderList();
  const q = query(collection(db, "chats", chatId, "messages"), orderBy("createdAt", "desc"), limit(40));
  unsubMsgs = onSnapshot(q,
    snap => renderMessages(snap.docs.map(d => ({ id: d.id, ...d.data() })).reverse()),
    err => { $("#messages").replaceChildren(el("p", "empty", "Impossible de charger les messages.")); toast(friendlyError(err)); });
  if (matchMedia("(pointer:fine)").matches) $("#input").focus();
}
$("#back").onclick = () => {
  $(".app").classList.remove("chat-open");
  if (unsubMsgs) { unsubMsgs(); unsubMsgs = null; }
  active = null; $("#chatBox").hidden = true; $("#placeholder").hidden = false; renderList();
};

function dayLabel(d) {
  const today = new Date(), yest = new Date(Date.now() - 864e5);
  const same = (a, b) => a.toDateString() === b.toDateString();
  if (same(d, today)) return "Aujourd'hui";
  if (same(d, yest)) return "Hier";
  return d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
}

function renderMessages(msgs) {
  const box = $("#messages");
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
  box.replaceChildren();
  if (!msgs.length) {
    box.append(el("p", "empty", "Aucun message pour l'instant. Écrivez le premier."));
    return;
  }
  const me = auth.currentUser.uid;
  let lastDay = "", lastSender = null;
  msgs.forEach(m => {
    const date = m.createdAt && m.createdAt.toDate ? m.createdAt.toDate() : new Date();
    const dl = dayLabel(date);
    if (dl !== lastDay) { box.append(el("span", "day", dl)); lastDay = dl; lastSender = null; }
    const mine = m.senderId === me;
    const row = el("div", "row " + (mine ? "me" : "them") + (m.senderId !== lastSender ? " first" : ""));
    if (!mine && active.isGroup && m.senderId !== lastSender) row.append(el("span", "who", m.senderName || "Membre"));
    const hasImg = typeof m.image === "string" && m.image.startsWith("data:image/");
    const bubble = el("div", "bubble" + (hasImg ? " has-photo" : ""));
    const remove = async () => {
      try { await deleteDoc(doc(db, "chats", active.id, "messages", m.id)); }
      catch (err) { toast(friendlyError(err)); }
    };
    if (hasImg) {
      const im = el("img", "photo");
      im.src = m.image; im.alt = "Photo"; im.loading = "lazy";
      im.onclick = ev => { ev.stopPropagation(); openPhoto(m.image, mine ? remove : null); };
      bubble.append(im);
      if (m.text) bubble.append(el("div", "cap", m.text));
    } else {
      bubble.textContent = m.text || "";
    }
    row.append(bubble, el("span", "time", date.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })));
    if (mine) {
      bubble.style.cursor = "pointer";
      bubble.onclick = () => {
        const old = row.querySelector(".del");
        if (old) { old.remove(); return; }
        const d = el("button", "del", "Supprimer");
        d.type = "button";
        d.onclick = async () => {
          try { await deleteDoc(doc(db, "chats", active.id, "messages", m.id)); }
          catch (err) { toast(friendlyError(err)); }
        };
        row.append(d);
      };
    }
    box.append(row);
    lastSender = m.senderId;
  });
  if (nearBottom || !box.dataset.ready) box.scrollTop = box.scrollHeight;
  box.dataset.ready = "1";
}

/* ---------- Envoi ---------- */
const input = $("#input");
const autosize = () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px"; };
input.addEventListener("input", autosize);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && matchMedia("(pointer:fine)").matches) { e.preventDefault(); $("#composer").requestSubmit(); }
});
$("#composer").addEventListener("submit", async e => {
  e.preventDefault();
  const text = input.value.trim();
  if ((!text && !pendingImage) || !active) return;
  const image = pendingImage;
  input.value = ""; autosize(); clearPreview();
  try {
    const payload = {
      text,
      senderId: auth.currentUser.uid,
      senderName: auth.currentUser.displayName || "Membre",
      createdAt: serverTimestamp()
    };
    if (image) payload.image = image;
    await addDoc(collection(db, "chats", active.id, "messages"), payload);
    const box = $("#messages"); box.scrollTop = box.scrollHeight;
  } catch (err) {
    input.value = text; autosize();
    if (image) { pendingImage = image; $("#previewImg").src = image; $("#preview").hidden = false; }
    toast(friendlyError(err));
  }
});

/* ---------- Photos ---------- */
let pendingImage = null;
function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const tries = [[900, 0.65], [720, 0.55], [560, 0.5]];
      for (const [max, q] of tries) {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        const data = c.toDataURL("image/jpeg", q);
        if (data.length <= 600000) { resolve(data); return; }
      }
      reject(new Error("too-big"));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad-image")); };
    img.src = url;
  });
}
function clearPreview() {
  pendingImage = null;
  $("#preview").hidden = true;
  $("#previewImg").removeAttribute("src");
}
function openPhoto(src, onDelete) {
  const o = el("div", "lightbox");
  const i = el("img"); i.src = src; i.alt = "Photo";
  o.append(i);
  if (onDelete) {
    const d = el("button", "del", "Supprimer");
    d.type = "button";
    d.onclick = ev => { ev.stopPropagation(); o.remove(); onDelete(); };
    o.append(d);
  }
  o.onclick = () => o.remove();
  document.body.append(o);
}
$("#attach").onclick = () => $("#file").click();
$("#previewCancel").onclick = clearPreview;
$("#file").addEventListener("change", async e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  if (!f.type.startsWith("image/")) { toast("Choisissez une image."); return; }
  try {
    pendingImage = await shrinkImage(f);
    $("#previewImg").src = pendingImage;
    $("#preview").hidden = false;
  } catch (err) {
    toast("Impossible de préparer cette photo.");
  }
});

/* ---------- Installation sur le téléphone ---------- */
let installEvent = null;
const showInstall = on => document.querySelectorAll(".install-btn").forEach(b => { b.hidden = !on; });
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvent = e; showInstall(true); });
window.addEventListener("appinstalled", () => { installEvent = null; showInstall(false); });
document.querySelectorAll(".install-btn").forEach(b => b.addEventListener("click", async () => {
  if (!installEvent) return;
  installEvent.prompt();
  await installEvent.userChoice;
  installEvent = null; showInstall(false);
}));
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

/* ---------- Appels vocaux (WebRTC) ---------- */
const ICE = { iceServers: [
  { urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }
  // Serveur TURN facultatif, à ajouter ici pour améliorer la réussite des appels :
  // , { urls: "turn:VOTRE_SERVEUR:3478", username: "VOTRE_NOM", credential: "VOTRE_MOT_DE_PASSE" }
] };
let call = null, ringCtx = null, ringTimer = null, unsubIncoming = null;

function ringStart() {
  try {
    ringCtx = ringCtx || new (window.AudioContext || window.webkitAudioContext)();
    const beep = () => {
      const o = ringCtx.createOscillator(), g = ringCtx.createGain();
      o.frequency.value = 440; o.connect(g); g.connect(ringCtx.destination);
      g.gain.setValueAtTime(0.0001, ringCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.2, ringCtx.currentTime + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, ringCtx.currentTime + 0.9);
      o.start(); o.stop(ringCtx.currentTime + 1);
    };
    beep(); ringTimer = setInterval(beep, 2000);
  } catch (e) { /* sonnerie facultative */ }
  try { if (navigator.vibrate) navigator.vibrate([400, 300, 400]); } catch (e) {}
}
function ringStop() {
  clearInterval(ringTimer); ringTimer = null;
  try { if (navigator.vibrate) navigator.vibrate(0); } catch (e) {}
}

function showCall(name, status, incoming) {
  $("#callName").textContent = name;
  $("#callAvatar").replaceChildren(avatar(name));
  $("#callStatus").textContent = status;
  $("#callAccept").hidden = !incoming;
  $("#callMute").hidden = true;
  $("#callMute").textContent = "Couper le micro";
  $("#callHang").textContent = incoming ? "Refuser" : "Raccrocher";
  $("#callOverlay").hidden = false;
}

function getMic() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.reject(new Error("no-media"));
  return navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true }, video: false });
}

function endCall(msg) {
  const c = call;
  if (!c) return;
  call = null;
  ringStop();
  clearTimeout(c.timeout); clearInterval(c.tick);
  c.unsubs.forEach(u => { try { u(); } catch (e) {} });
  try { if (c.pc) c.pc.close(); } catch (e) {}
  try { if (c.stream) c.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
  $("#remoteAudio").srcObject = null;
  $("#callOverlay").hidden = true;
  if (msg) toast(msg);
}

function setConnected() {
  const c = call;
  if (!c || c.connected) return;
  c.connected = true;
  ringStop(); clearTimeout(c.timeout);
  $("#callMute").hidden = false;
  $("#callAccept").hidden = true;
  $("#callHang").textContent = "Raccrocher";
  const t0 = Date.now();
  const tick = () => {
    const sec = Math.floor((Date.now() - t0) / 1000);
    $("#callStatus").textContent = "Connecté · " + String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
  };
  tick(); c.tick = setInterval(tick, 1000);
}

function makePeer(c, ownCandidates) {
  const pc = new RTCPeerConnection(ICE);
  c.pc = pc;
  c.stream.getTracks().forEach(t => pc.addTrack(t, c.stream));
  pc.ontrack = ev => { $("#remoteAudio").srcObject = ev.streams[0]; };
  pc.onicecandidate = ev => {
    if (!ev.candidate) return;
    const data = ev.candidate.toJSON();
    if (c.created) addDoc(collection(c.ref, ownCandidates), data).catch(() => {});
    else c.queue.push(data);
  };
  pc.onconnectionstatechange = () => {
    if (call !== c) return;
    if (pc.connectionState === "connected") setConnected();
    if (pc.connectionState === "failed") { hangUp(); toast("La connexion audio a échoué. Essayez avec le Wi-Fi."); }
  };
  return pc;
}
function addRemote(c, cand) {
  if (c.pc && c.pc.remoteDescription) c.pc.addIceCandidate(cand).catch(() => {});
  else c.pending.push(cand);
}
function flushRemote(c) {
  c.pending.splice(0).forEach(cand => c.pc.addIceCandidate(cand).catch(() => {}));
}

async function startCall() {
  if (call || !active || active.isGroup) return;
  const me = auth.currentUser;
  const calleeId = active.id.split("_").find(x => x !== me.uid);
  if (!calleeId) return;
  let stream;
  try { stream = await getMic(); } catch (e) { toast("Autorisez le micro pour appeler."); return; }
  const ref = doc(collection(db, "calls"));
  const c = { id: ref.id, ref, role: "caller", stream, pc: null, unsubs: [], queue: [], pending: [], created: false, connected: false };
  call = c;
  showCall(active.title, "Appel en cours…", false);
  ringStart();
  try {
    const pc = makePeer(c, "callerCandidates");
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await setDoc(ref, {
      callerId: me.uid, callerName: me.displayName || "Membre",
      calleeId, calleeName: active.title, status: "ringing",
      offer: { type: offer.type, sdp: offer.sdp }, createdAt: serverTimestamp()
    });
    c.created = true;
    c.queue.splice(0).forEach(d => addDoc(collection(ref, "callerCandidates"), d).catch(() => {}));
  } catch (err) { toast(friendlyError(err)); endCall(); return; }
  c.unsubs.push(onSnapshot(ref, async snap => {
    const d = snap.data();
    if (!d || call !== c) return;
    if (d.answer && !c.answered) {
      c.answered = true;
      try { await c.pc.setRemoteDescription(d.answer); flushRemote(c); } catch (e) { endCall("Appel impossible."); return; }
      $("#callStatus").textContent = "Connexion…";
    }
    if (d.status === "declined") endCall("Appel refusé.");
    else if (d.status === "missed") endCall("Pas de réponse.");
    else if (d.status === "ended") endCall("Appel terminé.");
  }, () => {}));
  c.unsubs.push(onSnapshot(collection(ref, "calleeCandidates"), snap => {
    snap.docChanges().forEach(ch => { if (ch.type === "added") addRemote(c, ch.doc.data()); });
  }, () => {}));
  c.timeout = setTimeout(() => {
    if (call === c && !c.connected) { updateDoc(ref, { status: "missed" }).catch(() => {}); endCall("Pas de réponse."); }
  }, 45000);
}

function listenIncoming(uid) {
  const q = query(collection(db, "calls"), where("calleeId", "==", uid), where("status", "==", "ringing"));
  return onSnapshot(q, snap => {
    snap.docChanges().forEach(ch => {
      if (ch.type !== "added") return;
      const d = ch.doc.data();
      const ts = d.createdAt && d.createdAt.toMillis ? d.createdAt.toMillis() : Date.now();
      if (Date.now() - ts > 50000) return;
      if (call) { updateDoc(ch.doc.ref, { status: "declined" }).catch(() => {}); return; }
      const c = { id: ch.doc.id, ref: ch.doc.ref, role: "callee", stream: null, pc: null, unsubs: [], queue: [], pending: [], created: true, connected: false, accepted: false, data: d };
      call = c;
      showCall(d.callerName || "Membre", "Appel entrant…", true);
      ringStart();
      c.unsubs.push(onSnapshot(c.ref, snap2 => {
        const x = snap2.data();
        if (call !== c || !x) return;
        if (["ended", "missed", "declined"].includes(x.status)) endCall(c.accepted ? "Appel terminé." : "Appel manqué.");
      }, () => {}));
      c.timeout = setTimeout(() => { if (call === c && !c.accepted) endCall("Appel manqué."); }, 45000);
    });
  }, () => {});
}

async function answerCall() {
  const c = call;
  if (!c || c.role !== "callee" || c.accepted) return;
  c.accepted = true;
  ringStop();
  $("#callAccept").hidden = true;
  $("#callStatus").textContent = "Connexion…";
  try { c.stream = await getMic(); }
  catch (e) { toast("Autorisez le micro pour répondre."); hangUp(); return; }
  try {
    const pc = makePeer(c, "calleeCandidates");
    await pc.setRemoteDescription(c.data.offer);
    flushRemote(c);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await updateDoc(c.ref, { answer: { type: answer.type, sdp: answer.sdp }, status: "active" });
    c.unsubs.push(onSnapshot(collection(c.ref, "callerCandidates"), snap => {
      snap.docChanges().forEach(ch => { if (ch.type === "added") addRemote(c, ch.doc.data()); });
    }, () => {}));
  } catch (err) { toast(friendlyError(err)); hangUp(); }
}

function hangUp() {
  const c = call;
  if (!c) return;
  const status = (c.role === "callee" && !c.accepted) ? "declined" : "ended";
  updateDoc(c.ref, { status }).catch(() => {});
  endCall();
}

$("#callBtn").onclick = startCall;
$("#callAccept").onclick = answerCall;
$("#callHang").onclick = hangUp;
$("#callMute").onclick = () => {
  if (!call || !call.stream) return;
  const track = call.stream.getAudioTracks()[0];
  if (!track) return;
  track.enabled = !track.enabled;
  $("#callMute").textContent = track.enabled ? "Couper le micro" : "Réactiver le micro";
};

setMode("login");
</script>
